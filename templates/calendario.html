<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario Corse - NCC</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css' rel='stylesheet' />
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js'></script>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/locales/it.js'></script>
    <style>
        #calendar {
            max-width: 1100px;
            margin: 0 auto;
        }
    </style>
</head>
<body class="container mt-5">
    <div class="card shadow p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>📅 Calendario Corse</h2>
            <div>
                <a href="/corsa" class="btn btn-success btn-sm">+ Nuova</a>
                <a href="/agenda" class="btn btn-info btn-sm text-white">Lista</a>
            </div>
        </div>
        
        <div id='calendar'></div>
        
        <div class="mt-4 text-center">
            <a href="/" class="btn btn-primary">Torna alla Home</a>
        </div>
    </div>

    <script>
      document.addEventListener('DOMContentLoaded', function() {
        var calendarEl = document.getElementById('calendar');
        var calendar = new FullCalendar.Calendar(calendarEl, {
          initialView: 'dayGridMonth',
          locale: 'it',
          headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek,listMonth'
          },
          events: {{ events|tojson }},
          eventClick: function(info) {
            alert('Cliente: ' + info.event.title + '\nPartenza: ' + info.event.extendedProps.partenza + '\nDestinazione: ' + info.event.extendedProps.destinazione);
          }
        });
        calendar.render();
      });
    </script>
</body>
</html>
