<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuova Corsa - NCC</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <div class="card shadow p-4">
        <h2 class="mb-4">📋 Nuova Corsa</h2>
        <form method="post">
            <div class="mb-3">
                <label class="form-label">Nome Cliente</label>
                <input name="cliente" class="form-control" placeholder="Esempio: Mario Rossi" required>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Data</label>
                    <input type="date" name="data" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Ora</label>
                    <input type="time" name="ora" class="form-control" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Partenza</label>
                <input name="partenza" class="form-control" placeholder="Indirizzo di partenza" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Destinazione</label>
                <input name="destinazione" class="form-control" placeholder="Indirizzo di destinazione" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Prezzo (€)</label>
                <input type="number" step="0.01" name="prezzo" class="form-control" placeholder="0.00" required>
            </div>
            <div class="d-flex justify-content-between">
                <a href="/" class="btn btn-secondary">Annulla</a>
                <button type="submit" class="btn btn-success">Salva Corsa</button>
            </div>
        </form>
    </div>
</body>
</html>
