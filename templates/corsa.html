<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if corsa %}Modifica{% else %}Nuova{% endif %} Corsa - NCC</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <div class="card shadow p-4">
        <h2 class="mb-4">📋 {% if corsa %}Modifica{% else %}Nuova{% endif %} Corsa</h2>
        <form method="post">
            <!-- NOME CLIENTE -->
            <div class="mb-3">
                <label class="form-label">Nome Cliente</label>
                <input name="cliente" class="form-control" placeholder="Esempio: Mario Rossi" 
                       value="{% if corsa %}{{ corsa[1] }}{% endif %}" required>
            </div>

            <!-- TELEFONO -->
            <div class="mb-3">
                <label class="form-label">Telefono Cliente</label>
                <input name="telefono" class="form-control" placeholder="+39 333 1234567"
                       value="{% if corsa %}{{ corsa[8] }}{% endif %}">
            </div>

            <!-- DATA / ORA -->
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Data</label>
                    <input type="date" name="data" class="form-control" 
                           value="{% if corsa %}{{ corsa[2] }}{% endif %}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Ora</label>
                    <input type="time" name="ora" class="form-control" 
                           value="{% if corsa %}{{ corsa[3] }}{% endif %}" required>
                </div>
            </div>

            <!-- PARTENZA -->
            <div class="mb-3">
                <label class="form-label">Partenza</label>
                <input name="partenza" class="form-control" placeholder="Indirizzo di partenza" 
                       value="{% if corsa %}{{ corsa[4] }}{% endif %}" required>
            </div>

            <!-- DESTINAZIONE -->
            <div class="mb-3">
                <label class="form-label">Destinazione</label>
                <input name="destinazione" class="form-control" placeholder="Indirizzo di destinazione" 
                       value="{% if corsa %}{{ corsa[5] }}{% endif %}" required>
            </div>

            <!-- PREZZO -->
            <div class="mb-3">
                <label class="form-label">Prezzo (€)</label>
                <input type="number" step="0.01" name="prezzo" class="form-control" placeholder="0.00" 
                       value="{% if corsa %}{{ '%.2f'|format(corsa[6]) }}{% endif %}" required>
            </div>

            <!-- IVA -->
            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" name="iva" id="iva">
                <label class="form-check-label" for="iva">
                    Prezzo + IVA (10%)
                </label>
            </div>

            <!-- NOTE -->
            <div class="mb-3">
                <label class="form-label">Note</label>
                <textarea name="note" class="form-control" rows="3"
                    placeholder="Note sul servizio (voli, bagagli, ritardi, ecc.)">{% if corsa %}{{ corsa[9] }}{% endif %}</textarea>
            </div>

            <!-- BOTTONI -->
            <div class="d-flex justify-content-between">
                <a href="/agenda" class="btn btn-secondary">Annulla</a>
                <button type="submit" class="btn btn-success">Salva Corsa</button>
            </div>
        </form>
    </div>
</body>
</html>
